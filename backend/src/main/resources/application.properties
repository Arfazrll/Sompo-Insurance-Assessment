# Konfigurasi Server
server.port=8080

# Konfigurasi SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=task_management_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Konfigurasi JWT
app.jwt.secret=TaskManagementSecretKey2024SompoInsuranceAssessmentJWTSecretKeyMinimal256Bits
app.jwt.expiration=86400000

# Konfigurasi CORS
app.cors.allowed-origins=http://localhost:4200
