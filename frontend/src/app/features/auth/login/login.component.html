<div class="split-layout">
  <!-- Left Content Section -->
  <app-auth-illustration 
    class="hidden-on-mobile"
    [isTyping]="isTyping"
    [hasPassword]="hasPassword"
    [hidePassword]="hidePassword">
  </app-auth-illustration>

  <!-- Right Login Section -->
  <div class="form-panel">
    <div class="auth-card">
      <div class="auth-header">
        <mat-icon class="auth-icon mobile-only">assignment</mat-icon>
        <h1>Welcome back!</h1>
        <p>Please enter your details</p>
      </div>

      <div class="auth-alert" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="contoh@email.com" id="login-email"
                 (focus)="onInputFocus()" (blur)="onInputBlur()">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="loginForm.get('email')?.touched">
            {{ getErrorMessage('email') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'"
                 placeholder="Masukkan password" id="login-password"
                 (focus)="onInputFocus()" (blur)="onInputBlur()">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.touched">
            {{ getErrorMessage('password') }}
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width submit-btn"
                [disabled]="isLoading" id="login-submit">
          <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Masuk</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Belum punya akun?</span>
        <a routerLink="/register">Daftar di sini</a>
      </div>
    </div>
  </div>
</div>
