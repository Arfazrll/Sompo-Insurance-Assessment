<div class="split-layout">
  <!-- Left Content Section -->
  <app-auth-illustration 
    class="hidden-on-mobile"
    [isTyping]="isTyping"
    [hasPassword]="hasPassword"
    [hidePassword]="hidePassword">
  </app-auth-illustration>

  <!-- Right Register Section -->
  <div class="form-panel">
    <div class="auth-card">
      <div class="auth-header">
        <mat-icon class="auth-icon mobile-only">person_add</mat-icon>
        <h1>Buat Akun Baru</h1>
        <p>Daftarkan diri Anda untuk mulai mengelola tugas</p>
      </div>

      <div class="auth-alert" *ngIf="errorMessage">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nama Lengkap</mat-label>
          <input matInput formControlName="fullName" placeholder="Masukkan nama lengkap" id="register-name"
                 (focus)="onInputFocus()" (blur)="onInputBlur()">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="registerForm.get('fullName')?.touched">
            {{ getErrorMessage('fullName') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="contoh@email.com" id="register-email"
                 (focus)="onInputFocus()" (blur)="onInputBlur()">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.touched">
            {{ getErrorMessage('email') }}
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" [type]="hidePassword ? 'password' : 'text'"
                 placeholder="Minimal 8 karakter" id="register-password"
                 (focus)="onInputFocus()" (blur)="onInputBlur()">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="registerForm.get('password')?.touched">
            {{ getErrorMessage('password') }}
          </mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width submit-btn"
                [disabled]="isLoading" id="register-submit">
          <mat-spinner *ngIf="isLoading" diameter="20" class="btn-spinner"></mat-spinner>
          <span *ngIf="!isLoading">Daftar</span>
        </button>
      </form>

      <div class="auth-footer">
        <span>Sudah punya akun?</span>
        <a routerLink="/login">Masuk di sini</a>
      </div>
    </div>
  </div>
</div>
