<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="side" [opened]="isSidenavOpen" class="app-sidenav">
    <div class="sidenav-header">
      <mat-icon class="brand-icon">assignment</mat-icon>
      <span class="brand-name">Task Manager</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" id="nav-dashboard">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/tasks" routerLinkActive="active-link" id="nav-tasks">
        <mat-icon matListItemIcon>list_alt</mat-icon>
        <span matListItemTitle>Daftar Tugas</span>
      </a>

      <a mat-list-item routerLink="/tasks/create" routerLinkActive="active-link" *ngIf="authService.isAdmin()"
        id="nav-create-task">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>List Tugas</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <div class="user-info">
        <mat-icon class="user-avatar">account_circle</mat-icon>
        <div class="user-details">
          <span class="user-name">{{ (authService.currentUser$ | async)?.fullName }}</span>
          <span class="user-role">{{ authService.isAdmin() ? 'Administrator' : 'User' }}</span>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="toggleSidenav()" id="toggle-sidenav">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      <span class="user-greeting">{{ (authService.currentUser$ | async)?.fullName }}</span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu" id="user-menu-trigger">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item disabled>
          <mat-icon>badge</mat-icon>
          <span>{{ (authService.currentUser$ | async)?.email }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" id="logout-btn">
          <mat-icon>logout</mat-icon>
          <span>Keluar</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
