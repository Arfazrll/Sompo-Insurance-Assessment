<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Batal</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">Ya, Hapus</button>
</mat-dialog-actions>
