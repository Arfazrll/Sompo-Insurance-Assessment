# Load env variables from .env file
spring.config.import=optional:file:.env[.properties]

# Konfigurasi Server
server.port=8080

# Konfigurasi SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=task_management_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourPassword123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Konfigurasi JWT
app.jwt.secret=${JWT_SECRET:TaskManagementSecretKey2024CompanyAssessmentJWTSecretKeyMinimal256Bits}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Konfigurasi CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

